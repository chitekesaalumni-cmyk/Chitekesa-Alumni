<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacancies & Opportunities - Chitekesa Alumni</title>
<style>
body { margin:0; font-family: 'Segoe UI', sans-serif; background:#f5f7fb; }
.vacancy-hero { background: linear-gradient(135deg, #0f4c75, #1b262c); color:white; padding:70px 20px 40px; text-align:center; position:relative; }
.admin-bar { position:absolute; top:15px; right:15px; display:flex; align-items:center; gap:8px; }
.admin-btn { background:rgba(255,255,255,0.15); color:white; border:1px solid rgba(255,255,255,0.4); padding:8px 15px; border-radius:20px; cursor:pointer; font-size:12px; backdrop-filter:blur(5px); }
#shareBtnMain { display:none; background:white; color:#0f4c75; padding:14px 25px; border-radius:30px; border:none; font-weight:bold; cursor:pointer; }
.search-box { max-width:700px; margin:25px auto 0; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.search-box input { flex:1; min-width:240px; max-width:420px; padding:14px 20px; border-radius:30px; border:none; outline:none; }
.filter-bar { display:flex; gap:10px; overflow-x:auto; padding:20px; max-width:1200px; margin:auto; scrollbar-width:none; }
.filter-chip { white-space:nowrap; padding:8px 18px; border-radius:30px; border:2px solid #0f4c75; background:white; color:#0f4c75; font-weight:bold; cursor:pointer; }
.filter-chip.active { background:#0f4c75; color:white; }
.chip-announcement { border-color:#c0392b; color:#c0392b; }
.chip-announcement.active { background:#c0392b; color:white; }
.vac-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap:20px; padding:20px 30px 60px; max-width:1200px; margin:auto; }
.vac-card { background:white; border-radius:16px; padding:22px; box-shadow:0 10px 25px rgba(0,0,0,0.08); border-left:5px solid #3282b8; display:flex; flex-direction:column; }
.vac-card.urgent { border-left-color:#e74c3c; }
.vac-card.trusted { border-left-color:#2e7d32; background: linear-gradient(to bottom, #ffffff, #f9fdf9); }
.vac-tag { display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:bold; margin-bottom:8px; }
.tag-job { background:#e3f2fd; color:#0f4c75; }
.tag-intern { background:#fff3e0; color:#ef6c00; }
.tag-announce { background:#ffebee; color:#c62828; }
.tag-trusted { background:#e8f5e9; color:#2e7d32; border:1px solid #c8e6c9; }
.btn-row{ display:flex; gap:8px; margin-top:auto; }
.btn-apply { flex:1; display:inline-block; background:#0f4c75; color:white; padding:11px 15px; border-radius:8px; text-decoration:none; text-align:center; font-weight:bold; font-size:13px; }
.btn-details { flex:1; display:inline-block; background:white; color:#0f4c75; border:1.5px solid #0f4c75; padding:11px 15px; border-radius:8px; text-decoration:none; text-align:center; font-weight:bold; font-size:13px; }
.deadline { font-size:12px; color:#e74c3c; font-weight:700; margin:6px 0; }
</style>
</head>
<body>
<div class="vacancy-hero">
  <div class="admin-bar">
    <button id="adminLoginBtn" class="admin-btn" onclick="openAdminLogin()">🔐 Admin Login</button>
    <button id="adminLogoutBtn" class="admin-btn" onclick="adminLogout()" style="display:none;">Logout</button>
  </div>
  <h1>💼 Vacancies & Announcements</h1>
  <p>Jobs, Internships, Scholarships & Important Updates for Alumni & Community</p>
  <div class="search-box">
    <input id="searchInput" placeholder="Search e.g. Teaching, Lilongwe, NGO..." onkeyup="filterCards()">
    <button id="shareBtnMain" onclick="document.getElementById('uploadModal').style.display='flex'">+ Post Vacancy / Announcement</button>
  </div>
</div>

<div class="filter-bar">
  <button class="filter-chip active" onclick="setFilter('All', this)">All</button>
  <button class="filter-chip" onclick="setFilter('Teaching', this)">Teaching</button>
  <button class="filter-chip" onclick="setFilter('NGO', this)">NGO</button>
  <button class="filter-chip" onclick="setFilter('Government', this)">Government</button>
  <button class="filter-chip" onclick="setFilter('Internship', this)">Internship</button>
  <button class="filter-chip" onclick="setFilter('Private', this)">Private Sector</button>
  <button class="filter-chip chip-announcement" onclick="setFilter('Announcement', this)">📢 Announcements</button>
  <button class="filter-chip" onclick="setFilter('Trusted', this)">✅ Trusted Job Sites</button>
</div>

<div class="vac-grid" id="vacGrid"></div>

<!-- Admin Login -->
<div id="adminLoginModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:2000;">
  <div style="background:white; padding:30px; border-radius:16px; width:90%; max-width:380px;">
    <h3>🔐 Admin Login</h3>
    <input id="adminEmail" type="email" placeholder="Admin Email" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ddd;">
    <input id="adminPass" type="password" placeholder="Password" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ddd;">
    <button onclick="adminLogin()" style="width:100%; padding:12px; background:#0f4c75; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Login</button>
    <button onclick="document.getElementById('adminLoginModal').style.display='none'" style="width:100%; padding:10px; margin-top:10px; background:#eee; border:none; border-radius:8px; cursor:pointer;">Cancel</button>
  </div>
</div>

<!-- Upload Modal -->
<div id="uploadModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000; overflow:auto; padding:20px;">
  <div style="background:white; padding:28px; border-radius:18px; width:95%; max-width:480px;">
    <h3 style="margin:0 0 16px 0; font-size:20px; font-weight:700;">Post Vacancy / Announcement</h3>
    <input id="vacTitle" placeholder="Title e.g. Primary Teachers - Chitekesa CDSS" style="width:100%; padding:13px 14px; margin:8px 0; border-radius:10px; border:1px solid #ddd; background:#f9fafb;">
    <div style="display:flex; gap:10px;">
      <select id="vacType" style="flex:1; padding:13px; margin:8px 0; border-radius:10px; border:1px solid #ddd; background:#f9fafb;">
        <option>Teaching</option>
        <option>NGO</option>
        <option>Government</option>
        <option>Internship</option>
        <option>Private Sector</option>
        <option>Scholarship</option>
        <option>Announcement</option>
      </select>
      <input id="vacOrg" placeholder="Organization e.g. MoE" style="flex:1; padding:13px 14px; margin:8px 0; border-radius:10px; border:1px solid #ddd; background:#f9fafb;">
    </div>
    <div style="display:flex; gap:10px;">
      <input id="vacLocation" placeholder="Location e.g. Lilongwe / Phalombe" style="flex:1; padding:13px 14px; margin:8px 0; border-radius:10px; border:1px solid #ddd; background:#f9fafb;">
      <input id="vacDeadline" type="date" style="flex:1; padding:13px 14px; margin:8px 0; border-radius:10px; border:1px solid #ddd; background:#f9fafb;">
    </div>
    <input id="vacLink" placeholder="Application Link or WhatsApp / Email (official link only)" style="width:100%; padding:13px 14px; margin:8px 0; border-radius:10px; border:1px solid #ddd; background:#f9fafb;">
    <textarea id="vacDesc" placeholder="Full details: requirements, how to apply, documents needed..." style="width:100%; padding:13px 14px; margin:8px 0; border-radius:10px; border:1px solid #ddd; background:#f9fafb; height:120px; resize:none;"></textarea>
    <button onclick="saveVacancy()" style="width:100%; padding:14px; background:#0f4c75; color:white; border:none; border-radius:12px; font-weight:700; cursor:pointer; margin-top:10px;">Publish Vacancy</button>
    <button onclick="document.getElementById('uploadModal').style.display='none'" style="width:100%; padding:12px; margin-top:10px; background:#f1f5f9; border:none; border-radius:12px; cursor:pointer; font-weight:600;">Cancel</button>
    <p style="font-size:11px; color:#888; text-align:center; margin-top:10px;">⚠️ Only post verified vacancies. No fake jobs.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyARXLsQe4i59U2iWZRHpRfIM33j1l7T_eY",
  authDomain: "chitekesa-alumni-ae55c.firebaseapp.com",
  projectId: "chitekesa-alumni-ae55c",
  storageBucket: "chitekesa-alumni-ae55c.firebasestorage.app",
  messagingSenderId: "943225897010",
  appId: "1:943225897010:web:2fc300df337d333aa2fc2b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const ADMIN_EMAILS = ["chitekesaalumni@gmail.com"];
let isAdmin = false;
let allVacancies = [];
let currentFilter = "All";

const TRUSTED_JOB_PLATFORMS = [
  { title: "MyJobo.com - Malawi Jobs Official", tag: "Trusted • Malawi #1", desc: "Most trusted Malawi job site - teaching, NGO, government, private sector. Verified daily.", link: "https://www.myjobo.com/", badge: "✓ Verified Malawi" },
  { title: "Job Search Malawi - Govt & NGO", tag: "Trusted • Malawi", desc: "Verified NGO, UN and government vacancies in Malawi.", link: "https://www.jobsearchmalawi.com/", badge: "✓ Verified" },
  { title: "GoJobs Malawi", tag: "Trusted • Malawi", desc: "Curated Malawi jobs - education, health, admin.", link: "https://www.gojobs.mw/", badge: "✓ Curated" },
  { title: "Malawi Civil Service Commission", tag: "Trusted • Government Official", desc: "Official government vacancies - ministries, teachers, health workers.", link: "https://www.csc.gov.mw/", badge: "✓ Govt Official" },
  { title: "UN Jobs - Malawi", tag: "Trusted • UN Official", desc: "Official UN, UNICEF, WHO, UNDP jobs in Malawi.", link: "https://unjobs.org/duty-stations/malawi", badge: "✓ UN Official" },
  { title: "NGO Jobs in Malawi - NGO Board", tag: "Trusted • NGO Official", desc: "NGO Board & international NGOs - Save, World Vision, CARE.", link: "https://www.ngo.mw/", badge: "✓ NGO Official" },
  { title: "LinkedIn Jobs - Malawi Filter", tag: "Trusted • International", desc: "Professional jobs - filter by Malawi. Create profile to apply.", link: "https://www.linkedin.com/jobs/search/?location=Malawi", badge: "✓ Global Trusted" },
  { title: "Opportunities for Young Malawians", tag: "Trusted • Youth Opportunities", desc: "Verified internships, scholarships, fellowships for Malawian youth.", link: "https://www.opportunitiesforyoungmalawians.com/", badge: "✓ Youth Trusted" }
];

function renderTrustedCard(j){
  return `
    <div class="vac-card trusted">
      <span class="tag-trusted">${j.badge}</span>
      <span class="vac-tag tag-job">${j.tag}</span>
      <h3 style="margin:6px 0;">${j.title}</h3>
      <p style="font-size:14px; color:#555; margin:8px 0 15px;">${j.desc}</p>
      <div class="btn-row">
        <a href="${j.link}" target="_blank" rel="noopener noreferrer" class="btn-apply">🔗 Visit Official Site</a>
        <a href="${j.link}" target="_blank" rel="noopener noreferrer" class="btn-details">👁️ Open</a>
      </div>
    </div>
  `;
}

onAuthStateChanged(auth, (user)=>{
  const shareBtn = document.getElementById('shareBtnMain');
  const loginBtn = document.getElementById('adminLoginBtn');
  const logoutBtn = document.getElementById('adminLogoutBtn');
  if(user && ADMIN_EMAILS.includes(user.email.toLowerCase())){
    isAdmin = true;
    shareBtn.style.display = "block";
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  } else {
    isAdmin = false;
    shareBtn.style.display = "none";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = user? "inline-block" : "none";
  }
});

window.openAdminLogin = ()=> document.getElementById('adminLoginModal').style.display='flex';
window.adminLogin = async ()=>{
  const email = document.getElementById('adminEmail').value.trim();
  const pass = document.getElementById('adminPass').value;
  try{ await signInWithEmailAndPassword(auth, email, pass); document.getElementById('adminLoginModal').style.display='none'; alert("Welcome Admin! ✅"); }
  catch(e){ alert("Login failed: " + e.message); }
};
window.adminLogout = async ()=>{ await signOut(auth); alert("Logged out"); };

async function loadVacancies(){
  render();
  try{
    const snap = await getDocs(collection(db, "vacancies"));
    allVacancies = [];
    snap.forEach(d=>allVacancies.push({id:d.id,...d.data()}));
    allVacancies.sort((a,b)=>{
      const ta = a.createdAt?.seconds || new Date(a.createdAt).getTime() || 0;
      const tb = b.createdAt?.seconds || new Date(b.createdAt).getTime() || 0;
      return tb - ta;
    });
  }catch(e){ console.log(e); }
  render();
}

function render(){
  const grid = document.getElementById('vacGrid');
  const search = document.getElementById('searchInput').value.toLowerCase();
  let html = "";

  if(currentFilter==="All" || currentFilter==="Trusted"){
    let list = TRUSTED_JOB_PLATFORMS.filter(j => (j.title+" "+j.desc).toLowerCase().includes(search));
    if(currentFilter==="All") list = list.slice(0,3);
    html += list.map(j=>renderTrustedCard(j)).join('');
  }

  let filtered = allVacancies.filter(v=>{
    const t = (v.type||"").toLowerCase();
    let match = false;
    if(currentFilter==="All") match = true;
    else if(currentFilter==="Teaching") match = t.includes("teach");
    else if(currentFilter==="NGO") match = t.includes("ngo");
    else if(currentFilter==="Government") match = t.includes("government");
    else if(currentFilter==="Internship") match = t.includes("intern");
    else if(currentFilter==="Private") match = t.includes("private");
    else if(currentFilter==="Announcement") match = t.includes("announce");
    else if(currentFilter==="Trusted") match = false;
    else match = true;
    const searchMatch = (v.title+" "+(v.organization||"")+" "+(v.location||"")).toLowerCase().includes(search);
    return match && searchMatch;
  });

  if(filtered.length>0){
    html += filtered.map(v=>{
      const isAnn = (v.type||"").toLowerCase().includes("announce");
      const isExpired = v.deadline && new Date(v.deadline) < new Date();
      return `
        <div class="vac-card ${isAnn? 'urgent':''}" style="${isExpired? 'opacity:0.6':''}">
          <span class="vac-tag ${isAnn? 'tag-announce': v.type?.toLowerCase().includes('intern')? 'tag-intern':'tag-job'}">${v.type} ${isExpired? '• EXPIRED':''}</span>
          <h3 style="margin:6px 0;">${v.title}</h3>
          <p style="font-size:13px; color:#666; margin:2px 0;">🏢 ${v.organization||'Chitekesa Alumni'} • 📍 ${v.location||'Malawi'}</p>
          ${v.deadline? `<p class="deadline">⏰ Deadline: ${v.deadline}</p>`:''}
          <p style="font-size:14px; color:#444; margin:8px 0 15px;">${(v.desc||'').substring(0,180)}${(v.desc||'').length>180?'...':''}</p>
          <div class="btn-row">
            <a href="${v.link||'#'}" target="_blank" class="btn-apply">${isAnn? '📢 View Details':'📨 Apply Now'}</a>
            <a href="${v.link||'#'}" target="_blank" class="btn-details">👁️ Details</a>
          </div>
        </div>
      `;
    }).join('');
  }

  if(html===""){
    grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:40px;">No ${currentFilter} vacancies yet.<br>Admin will post verified opportunities.<br><br>Check Trusted Job Sites tab for official platforms.</p>`;
  } else {
    grid.innerHTML = html;
  }
}

window.setFilter = (type, btn)=>{
  currentFilter = type;
  document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
};
window.filterCards = render;

window.saveVacancy = async ()=>{
  if(!isAdmin) return alert("Only admins can post!");
  const data = {
    title: document.getElementById('vacTitle').value.trim(),
    type: document.getElementById('vacType').value,
    organization: document.getElementById('vacOrg').value.trim(),
    location: document.getElementById('vacLocation').value.trim(),
    deadline: document.getElementById('vacDeadline').value,
    link: document.getElementById('vacLink').value.trim(),
    desc: document.getElementById('vacDesc').value.trim(),
    createdAt: new Date(),
    postedBy: auth.currentUser.email
  };
  if(!data.title || !data.desc) return alert("Title and details required!");
  try{
    await addDoc(collection(db, "vacancies"), data);
    alert("Published! ✅ Vacancy is now live");
    document.getElementById('uploadModal').style.display='none';
    document.getElementById('vacTitle').value="";
    document.getElementById('vacDesc').value="";
    loadVacancies();
  }catch(e){ alert("Error: "+e.message); }
};

loadVacancies();
</script>
</body>
</html>
