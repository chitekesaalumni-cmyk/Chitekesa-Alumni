<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacancies - Chitekesa Alumni - FINAL</title>
<style>
:root{ --green:#0a7a3c; --green-light:#14a85a; --blue:#0f2b46; --orange:#ff6b2d; --bg:#f5f7fb; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:#1f2937;}
.header{background:linear-gradient(135deg,var(--green) 0%, var(--green-light) 100%);padding:28px 15px;text-align:center;color:white;}
.logo{width:85px;height:85px;background:white;border-radius:50%;margin:0 auto 12px;border:4px solid rgba(255,255,255,0.25);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--green);font-weight:800;font-size:24px;}
.logo img{width:100%;height:100%;object-fit:cover;display:block;}
.vacancy-hero{background:linear-gradient(135deg,#0f4c75,#1b262c);color:white;padding:70px 20px 40px;text-align:center;position:relative;}
/* === SAME TRICK AS INDEX === */
.admin-bar{position:absolute;top:15px;right:15px;display:flex;gap:8px;}
.admin-btn{display:none !important;background:rgba(255,255,255,0.15);color:white;border:1px solid rgba(255,255,255,0.4);padding:8px 15px;border-radius:20px;cursor:pointer;font-size:12px;backdrop-filter:blur(5px);}
#shareBtnMain{display:none !important;background:white;color:#0f4c75;padding:14px 25px;border-radius:30px;border:none;font-weight:bold;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.2);}
/* When admin unlocked, show */
body.is-admin .admin-btn{display:inline-block !important;}
body.is-admin #shareBtnMain{display:block !important;}

.search-box{max-width:700px;margin:25px auto 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.search-box input{flex:1;min-width:240px;max-width:420px;padding:14px 20px;border-radius:30px;border:none;outline:none;}
.filter-bar{display:flex;gap:10px;overflow-x:auto;padding:20px;max-width:1200px;margin:auto;}
.filter-chip{white-space:nowrap;padding:8px 18px;border-radius:30px;border:2px solid #0f4c75;background:white;color:#0f4c75;font-weight:bold;cursor:pointer;font-size:13px;}
.filter-chip.active{background:#0f4c75;color:white;}
.vac-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto;}
.vac-card{background:white;border-radius:16px;padding:22px;box-shadow:0 10px 25px rgba(0,0,0,0.08);border-left:5px solid #3282b8;display:flex;flex-direction:column;}
.navbar{background:var(--blue);padding:10px 12px;position:sticky;top:0;z-index:999;}
.menu-toggle{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;padding:8px 14px;border-radius:8px;cursor:pointer;}
#navOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:998;display:none}
#navOverlay.show{display:block}
.menu{list-style:none;position:fixed;top:0;left:-100%;width:285px;height:100vh;background:#002244;z-index:999;padding:22px 18px;display:flex;flex-direction:column;gap:2px;transition:left 0.35s ease;}
.menu.active{left:0 !important}
.menu a{color:rgba(255,255,255,0.88);text-decoration:none;padding:11px 14px;display:flex;gap:10px;border-radius:10px;}
</style>
</head>
<body>
<header class="header">
  <div class="logo"><img src="Alumni logo.png" alt="CDSS Logo"></div>
  <h1>CHITEKESA CDSS ALUMNI GROUP</h1>
  <h4>Together We Make The Difference</h4>
</header>
<nav class="navbar"><button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button></nav>
<div id="navOverlay" onclick="toggleMenu()"></div>
<ul id="menu" class="menu">
  <li><a href="index.html">🏠 Home</a></li>
  <li><a href="vacancies.html">💼 Vacancies</a></li>
  <li><a href="education-corner.html">📚 Education</a></li>
</ul>

<div class="vacancy-hero">
  <div class="admin-bar">
    <button id="adminLoginBtn" class="admin-btn" onclick="openAdminLogin()">🔐 Admin Login</button>
    <button id="adminLogoutBtn" class="admin-btn" onclick="adminLogout()">Logout</button>
  </div>
  <h1>💼 Vacancies & Announcements</h1>
  <div class="search-box"><input id="searchInput" placeholder="Search jobs..." onkeyup="filterCards()"><button id="shareBtnMain" onclick="document.getElementById('uploadModal').style.display='flex'">+ Post Vacancy</button></div>
</div>

<div class="filter-bar">
  <button class="filter-chip active" onclick="setFilter('All',this)">All</button>
  <button class="filter-chip" onclick="setFilter('Teaching',this)">Teaching</button>
  <button class="filter-chip" onclick="setFilter('NGO',this)">NGO</button>
  <button class="filter-chip" onclick="setFilter('Trusted',this)">✅ Trusted Job Sites</button>
</div>
<div class="vac-grid" id="vacGrid"></div>

<!-- KEEP YOUR MODALS SAME - I won't repeat to keep short -->
<div id="adminLoginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:2000;">
  <div style="background:white;padding:30px;border-radius:16px;width:90%;max-width:380px;"><h3>🔐 Admin Login</h3><input id="adminEmail" type="email" placeholder="Admin Email" style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ddd;"><input id="adminPass" type="password" placeholder="Password" style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ddd;"><button onclick="adminLogin()" style="width:100%;padding:12px;background:#0f4c75;color:white;border:none;border-radius:8px;font-weight:bold;">Login</button><button onclick="document.getElementById('adminLoginModal').style.display='none'" style="width:100%;padding:10px;margin-top:10px;background:#eee;border:none;border-radius:8px;">Cancel</button></div>
</div>
<div id="uploadModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);justify-content:center;align-items:center;z-index:1000;padding:20px;">
  <div style="background:white;padding:28px;border-radius:18px;width:95%;max-width:480px;"><h3>Post Vacancy</h3><input id="vacTitle" placeholder="Title" style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;"><select id="vacType" style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;"><option>Teaching</option><option>NGO</option><option>Government</option><option>Internship</option><option>Private Sector</option><option>Announcement</option></select><input id="vacOrg" placeholder="Organization" style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;"><input id="vacLocation" placeholder="Location" style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;"><input id="vacDeadline" type="date" style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;"><input id="vacLink" placeholder="Application Link" style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;"><textarea id="vacDesc" placeholder="Full details..." style="width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #ddd;height:120px;"></textarea><button onclick="saveVacancy()" style="width:100%;padding:14px;background:#0f4c75;color:white;border:none;border-radius:12px;font-weight:700;">Publish</button><button onclick="document.getElementById('uploadModal').style.display='none'" style="width:100%;padding:12px;margin-top:10px;background:#f1f5f9;border:none;border-radius:12px;">Cancel</button></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyARXLsQe4i59U2iWZRHpRfIM33j1l7T_eY", authDomain: "chitekesa-alumni-ae55c.firebaseapp.com", projectId: "chitekesa-alumni-ae55c", storageBucket: "chitekesa-alumni-ae55c.firebasestorage.app", messagingSenderId: "943225897010", appId: "1:943225897010:web:2fc300df337d333aa2fc2b" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
const ADMIN_EMAILS = ["chitekesaalumni@gmail.com"]; let isAdmin=false; let allVacancies=[]; let currentFilter="All";
const TRUSTED_JOB_PLATFORMS=[{title:"MyJobo.com - Malawi Jobs",tag:"Trusted",desc:"Most trusted Malawi job site.",link:"https://www.myjobo.com/",badge:"✓ Verified"}];
function renderTrustedCard(j){return `<div class="vac-card"><span>${j.badge}</span><h3>${j.title}</h3><p>${j.desc}</p><a href="${j.link}" target="_blank" style="background:#0f4c75;color:white;padding:10px;border-radius:8px;text-decoration:none;text-align:center;">Visit Site</a></div>`;}
window.toggleMenu=()=>{document.getElementById('menu').classList.toggle('active');document.getElementById('navOverlay').classList.toggle('show');}
window.openAdminLogin=()=>document.getElementById('adminLoginModal').style.display='flex';
window.adminLogin=async()=>{const email=document.getElementById('adminEmail').value.trim();const pass=document.getElementById('adminPass').value;try{await signInWithEmailAndPassword(auth,email,pass);document.getElementById('adminLoginModal').style.display='none';}catch(e){alert(e.message)}};
window.adminLogout=async()=>{await signOut(auth);localStorage.removeItem('chitekesaAdmin');localStorage.removeItem('chitekesa_admin_edu');document.body.classList.remove('is-admin');location.reload();};
onAuthStateChanged(auth,(user)=>{if(user && ADMIN_EMAILS.includes(user.email.toLowerCase())){isAdmin=true;document.body.classList.add('is-admin');localStorage.setItem('chitekesaAdmin','loggedIn');localStorage.setItem('chitekesa_admin_edu','yes');} else if(!localStorage.getItem('chitekesaAdmin')){isAdmin=false;document.body.classList.remove('is-admin');}});
async function loadVacancies(){try{const snap=await getDocs(collection(db,"vacancies"));allVacancies=[];snap.forEach(d=>allVacancies.push({id:d.id,...d.data()}));}catch(e){}render();}
function render(){const grid=document.getElementById('vacGrid');const search=(document.getElementById('searchInput').value||"").toLowerCase();let html="";if(currentFilter==="All"||currentFilter==="Trusted"){html+=TRUSTED_JOB_PLATFORMS.filter(j=>(j.title+" "+j.desc).toLowerCase().includes(search)).map(j=>renderTrustedCard(j)).join('');}let filtered=allVacancies.filter(v=>{if(currentFilter==="All") return true; return (v.type||"").toLowerCase().includes(currentFilter.toLowerCase());});html+=filtered.map(v=>`<div class="vac-card"><h3>${v.title}</h3><p>${v.organization||''} • ${v.location||''}</p><p>${(v.desc||'').substring(0,150)}</p><a href="${v.link||'#'}" target="_blank" style="background:#0f4c75;color:white;padding:8px;border-radius:8px;text-decoration:none;">Apply</a></div>`).join('');grid.innerHTML=html||"<p style='text-align:center;padding:40px'>No vacancies yet.</p>";}
window.setFilter=(type,btn)=>{currentFilter=type;document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();};
window.filterCards=render;
window.saveVacancy=async()=>{if(!isAdmin && !document.body.classList.contains('is-admin')) return alert("Only admin");const data={title:document.getElementById('vacTitle').value, type:document.getElementById('vacType').value, organization:document.getElementById('vacOrg').value, location:document.getElementById('vacLocation').value, deadline:document.getElementById('vacDeadline').value, link:document.getElementById('vacLink').value, desc:document.getElementById('vacDesc').value, createdAt:new Date(), postedBy:auth.currentUser?.email||'admin'};await addDoc(collection(db,"vacancies"),data);alert("Published");document.getElementById('uploadModal').style.display='none';loadVacancies();};
loadVacancies();
</script>

<!-- === SAME SECRET TRICK AS INDEX === -->
<script>
(function(){
  const SECRET="chitekesa2026";
  if(localStorage.getItem('chitekesaAdmin')==='loggedIn' || localStorage.getItem('chitekesa_admin_edu')==='yes'){ document.body.classList.add('is-admin'); }
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='a'){
      const p=prompt("Enter Admin Secret Code:");
      if(p===SECRET || p==="Chiteke@2026!"){
        document.body.classList.add('is-admin');
        localStorage.setItem('chitekesaAdmin','loggedIn');
        localStorage.setItem('chitekesa_admin_edu','yes');
        alert("Admin Portal Unlocked ✅ Same as index - now works on all pages!");
      } else alert("Wrong code ❌");
    }
  });
  const params=new URLSearchParams(window.location.search);
  if(params.get('admin')===SECRET){
    document.body.classList.add('is-admin');
    localStorage.setItem('chitekesaAdmin','loggedIn');
    localStorage.setItem('chitekesa_admin_edu','yes');
    history.replaceState(null,'',window.location.pathname);
    alert("Admin unlocked via link ✅");
  }
})();
</script>
</body>
</html>
