<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Education Corner - Chitekesa Alumni</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0a3d6b;--blue2:#10548f;--green:#0f2e1a;--bg:#f4f7fb;--card:#fff;--border:#d9e2ec;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:var(--bg);color:#1f2937}
.header{background:linear-gradient(135deg,#0a3d6b,#1a6fb5);color:white;padding:22px 16px 30px;text-align:center}
.header-top{display:flex;justify-content:flex-end;gap:8px;padding:0 8px 12px}
.header-top button{padding:8px 16px;border-radius:20px;border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);color:white;font-weight:600;cursor:pointer}
.header-top .admin{background:#0b9a5a;border-color:#0b9a5a}
.search-row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.search-row input{width:65%;max-width:520px;padding:14px 18px;border-radius:28px;border:none;font-size:15px;outline:none}
.search-row .share{background:white;color:var(--blue);padding:12px 22px;border-radius:28px;border:none;font-weight:700;cursor:pointer}
.filters{display:flex;gap:10px;overflow-x:auto;padding:14px 12px;background:white;border-bottom:1px solid var(--border);white-space:nowrap}
.filters button{padding:8px 18px;border-radius:20px;border:1.5px solid var(--blue);background:white;color:var(--blue);font-weight:600;cursor:pointer}
.filters button.active{background:var(--blue);color:white}
.container{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06);border:1px solid var(--border)}
.card h3{color:var(--blue);font-size:16px}
.card p{font-size:13px;color:var(--muted);margin:6px 0}
.btn{display:inline-flex;padding:9px 16px;border-radius:10px;text-decoration:none;font-weight:600;font-size:13px;margin:5px 4px;color:white}
.btn-blue{background:var(--blue2)} .btn-green{background:#0f6a3a} .btn-orange{background:#ff7a00}
.trusted-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.trusted-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <button onclick="location.href='index.html'">Logout</button>
    <button class="admin">Admin Mode</button>
  </div>
  <h1 style="font-size:28px">📚 Education Corner</h1>
  <p style="opacity:.9;margin-top:6px">Past Papers, Books, Notes & Career Resources by Alumni</p>
  <div class="search-row">
    <input id="searchInput" placeholder="Search e.g. Biology 2023 .." onkeyup="doSearch()">
    <button class="share" onclick="openShare()">+ Share</button>
  </div>
</div>

<div class="filters" id="filters">
  <button onclick="filterBy('all')" class="active" id="f-all">All</button>
  <button onclick="filterBy('past paper')" id="f-past">Past Papers</button>
  <button onclick="filterBy('notes')" id="f-notes">Notes</button>
  <button onclick="filterBy('syllabus')" id="f-syllabus">Syllabus</button>
  <button onclick="filterBy('university')" id="f-university">University</button>
  <button onclick="filterBy('scholarships')" id="f-scholarships">Scholarships</button>
  <button onclick="filterBy('books')" id="f-books">Books</button>
</div>

<div class="container">
  <div id="trustedBox" style="display:none"></div>
  <div id="notesList">Loading notes...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyARXLsQe4i59U2iWZRHpRfIM33j1l7T_eY",
  authDomain: "chitekesa-alumni-ae55c.firebaseapp.com",
  projectId: "chitekesa-alumni-ae55c",
  storageBucket: "chitekesa-alumni-ae55c.firebasestorage.app",
  messagingSenderId: "943225897010",
  appId: "1:943225897010:web:2fc300df337d333aa2fc2b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let allNotes=[];

function loadNotes(){
  db.collection("education_resources").orderBy("createdAt","desc").onSnapshot(snap=>{
    allNotes=[];
    snap.forEach(doc=>{
      allNotes.push({id:doc.id, ...doc.data()});
    });
    render(allNotes);
  });
}

function render(list){
  const box=document.getElementById("notesList");
  if(list.length==0){box.innerHTML="<p style='text-align:center;color:#999;margin-top:30px'>No resources found in this category.</p>";return;}
  box.innerHTML=list.map(n=>`
    <div class="card">
      <h3>${n.title||'Untitled'}</h3>
      <p>${n.subject||''} • ${n.type||''} • ${n.year||''}</p>
      <p>${n.desc||''}</p>
      <a href="${n.link}" target="_blank" class="btn btn-blue">📥 View / Download</a>
    </div>
  `).join("");
}

function filterBy(cat){
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  document.getElementById("f-"+cat.replace(" ","").replace("pastpaper","past")).classList.add("active");
  
  if(cat==='university'){
    document.getElementById("notesList").innerHTML="";
    document.getElementById("trustedBox").style.display="block";
    document.getElementById("trustedBox").innerHTML=`
      <div class="card" style="border:1.5px solid #0a3d6b">
        <h3>🎓 University Applications - Official Platforms</h3>
        <p>Click to read full official information directly from government and universities.</p>
        <div class="trusted-grid" style="margin-top:12px">
          <a href="https://www.nche.ac.mw" target="_blank" class="btn btn-blue">NCHE Malawi - Official Selection & Applications</a>
          <a href="https://www.education.gov.mw" target="_blank" class="btn btn-green">Ministry of Education Malawi</a>
          <a href="https://www.unima.ac.mw" target="_blank" class="btn btn-blue">UNIMA - University of Malawi</a>
          <a href="https://www.must.ac.mw" target="_blank" class="btn btn-green">MUST - Malawi Univ. of Science</a>
          <a href="https://www.luanar.ac.mw" target="_blank" class="btn btn-blue">LUANAR</a>
          <a href="https://www.mubas.ac.mw" target="_blank" class="btn btn-green">MUBAS - Poly</a>
        </div>
      </div>`;
    return;
  }
  if(cat==='scholarships'){
    document.getElementById("notesList").innerHTML="";
    document.getElementById("trustedBox").style.display="block";
    document.getElementById("trustedBox").innerHTML=`
      <div class="card" style="border:1.5px solid #0f6a3a">
        <h3>💰 Scholarships - Trusted Platforms (No Fees)</h3>
        <p>We link you to verified scholarship sites. Never pay anyone for scholarship.</p>
        <div class="trusted-grid" style="margin-top:12px">
          <a href="https://mastercardfdn.org/all/scholars/becoming-a-scholar/" target="_blank" class="btn btn-orange">Mastercard Foundation Scholars - Full Scholarship for Africa</a>
          <a href="https://cscuk.fcdo.gov.uk/scholarships/" target="_blank" class="btn btn-blue">Commonwealth Scholarships - UK</a>
          <a href="https://www.daad.de/en/" target="_blank" class="btn btn-green">DAAD Germany Scholarships</a>
          <a href="https://www.scholarshipportal.com" target="_blank" class="btn btn-blue">ScholarshipPortal - Search All Scholarships</a>
          <a href="https://opportunitydesk.org" target="_blank" class="btn btn-orange">Opportunity Desk - Youth Opportunities in Africa</a>
          <a href="https://www.unesco.org/en/fellowships" target="_blank" class="btn btn-green">UNESCO Fellowships</a>
          <a href="https://www.globalgiving.org" target="_blank" class="btn btn-blue">Malawi Education Trust Fund</a>
        </div>
      </div>`;
    return;
  }
  
  document.getElementById("trustedBox").style.display="none";
  if(cat==='all'){render(allNotes);return;}
  const filtered=allNotes.filter(n=> (n.type||"").toLowerCase().includes(cat) || (n.subject||"").toLowerCase().includes(cat) );
  render(filtered);
}

function doSearch(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  const filtered=allNotes.filter(n=> JSON.stringify(n).toLowerCase().includes(q));
  document.getElementById("trustedBox").style.display="none";
  render(filtered);
}

function openShare(){
  const link=prompt("Paste your Google Drive link (make sure 'Anyone with link'):");
  if(!link) return;
  const title=prompt("Title e.g. Biology Notes 2023");
  const subject=prompt("Subject e.g. Biology");
  const type=prompt("Type: past paper / notes / syllabus / books");
  if(title && link){
    db.collection("education_resources").add({
      title:title, subject:subject||"", type:type||"notes", link:link, desc:"Shared by Alumni", year:new Date().getFullYear().toString(), uploadedBy:"alumni", createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(()=>alert("✅ Shared successfully!"));
  }
}

loadNotes();
</script>
</body>
</html>
