<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Education Corner - Chitekesa Alumni</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0a3d6b;--blue2:#10548f;--bg:#f4f7fb;--card:#fff;--border:#d9e2ec;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:var(--bg);color:#1f2937}
.header{background:linear-gradient(135deg,#0a3d6b,#1e6fb5);color:white;padding:18px 16px 36px;text-align:center}
.header-top{display:flex;justify-content:flex-end;gap:8px;padding:0 8px 18px}
.header-top button{padding:8px 18px;border-radius:20px;border:1.5px solid rgba(255,255,255,.8);background:transparent;color:white;font-weight:600;cursor:pointer}
.header-top button.admin{background:#0b9a5a;border-color:#0b9a5a}
.header h1{font-size:30px;font-weight:700}
.header p{opacity:.9;margin-top:10px;font-size:15px}
.search-row{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.search-row input{width:62%;max-width:500px;padding:16px 20px;border-radius:30px;border:none;font-size:15px;outline:none}
.search-row.share-btn{background:white;color:#0a3d6b;padding:14px 28px;border-radius:30px;border:none;font-weight:700;cursor:pointer;font-size:15px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.filters{display:flex;gap:10px;overflow-x:auto;padding:14px 12px;background:white;border-bottom:1px solid var(--border);white-space:nowrap}
.filters button{padding:10px 20px;border-radius:25px;border:2px solid #0a3d6b;background:white;color:#0a3d6b;font-weight:600;cursor:pointer;flex-shrink:0}
.filters button.active{background:#0a3d6b;color:white}
.container{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.06);border:1px solid var(--border)}
.card h3{color:var(--blue);font-size:16px}
.card p{font-size:13px;color:var(--muted);margin:6px 0}
.btn{display:inline-flex;padding:9px 16px;border-radius:10px;text-decoration:none;font-weight:600;font-size:13px;margin:5px 4px;color:white}
.btn-blue{background:var(--blue2)}.btn-green{background:#0f6a3a}.btn-orange{background:#ff7a00}
.btn-outline{background:white;color:var(--blue);border:1.5px solid var(--blue)}
.trusted-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.trusted-grid{grid-template-columns:1fr}}
/* Professional Share Modal */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:999;justify-content:center;align-items:center;padding:16px}
.modal.show{display:flex}
.modal-content{background:white;width:100%;max-width:500px;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.modal-content h2{color:#0a3d6b;margin-bottom:16px;text-align:center}
.modal-content label{font-size:13px;font-weight:600;color:#333;margin-top:10px;display:block}
.modal-content input,.modal-content select,.modal-content textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);margin-top:6px;font-family:Poppins,sans-serif;font-size:14px;outline:none}
.modal-content input:focus,.modal-content select:focus,.modal-content textarea:focus{border-color:var(--blue)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;cursor:pointer}
.btn-cancel{background:#f1f5f9;color:#333}
.btn-submit{background:#0a3d6b;color:white}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <button onclick="location.href='index.html'">Logout</button>
    <button class="admin">Admin Mode</button>
  </div>
  <h1>📚 Education Corner</h1>
  <p>Past Papers, Books, Notes & Career Resources by Alumni</p>
  <div class="search-row">
    <input id="searchInput" placeholder="Search e.g. Biology MSCE 2023..." onkeyup="doSearch()">
    <button class="share-btn" onclick="openShareModal()">+ Share</button>
  </div>
</div>

<div class="filters" id="filters">
  <button onclick="filterBy('all')" class="active" id="f-all">All</button>
  <button onclick="filterBy('msce')" id="f-msce">MSCE</button>
  <button onclick="filterBy('jce')" id="f-jce">JCE</button>
  <button onclick="filterBy('past paper')" id="f-past">Past Papers</button>
  <button onclick="filterBy('notes')" id="f-notes">Notes</button>
  <button onclick="filterBy('books')" id="f-books">Books</button>
  <button onclick="filterBy('syllabus')" id="f-syllabus">Syllabus</button>
  <button onclick="filterBy('university')" id="f-university">University</button>
  <button onclick="filterBy('scholarship')" id="f-scholarship">Scholarship</button>
</div>

<div class="container">
  <div id="trustedBox" style="display:none"></div>
  <div id="notesList">Loading notes...</div>
</div>

<!-- Professional Share Modal -->
<div class="modal" id="shareModal" onclick="if(event.target==this) closeShareModal()">
  <div class="modal-content">
    <h2>📤 Share Education Resource</h2>
    <label>Title *</label>
    <input id="mTitle" placeholder="e.g. Biology MSCE Past Paper 2023">
    <label>Level *</label>
    <select id="mLevel"><option value="">Select Level</option><option>MSCE</option><option>JCE</option><option>BOOKS</option><option>UNIVERSITY</option><option>ALL</option></select>
    <label>Subject</label>
    <input id="mSubject" placeholder="e.g. Biology, Mathematics">
    <label>Type *</label>
    <select id="mType"><option value="">Select Type</option><option value="past paper">Past Paper</option><option value="notes">Notes</option><option value="books">Books</option><option value="syllabus">Syllabus</option><option value="msce">MSCE</option><option value="jce">JCE</option></select>
    <label>Google Drive Link *</label>
    <input id="mLink" placeholder="https://drive.google.com/file/d/...">
    <p style="font-size:11px;color:#888;margin-top:4px">Make sure link is "Anyone with the link - Viewer"</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeShareModal()">Cancel</button>
      <button class="btn-submit" onclick="submitShare()">Share Now</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyARXLsQe4i59U2iWZRHpRfIM33j1l7T_eY",
  authDomain: "chitekesa-alumni-ae55c.firebaseapp.com",
  projectId: "chitekesa-alumni-ae55c",
  storageBucket: "chitekesa-alumni-ae55c.firebasestorage.app",
  messagingSenderId: "943225897010",
  appId: "1:943225897010:web:2fc300df337d333aa2fc2b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
let allNotes=[];

function toDirectDownload(link){
  try{
    if(!link) return link;
    if(link.includes('uc?export=download')) return link;
    let id=null;
    if(link.includes('/file/d/')) id=link.split('/file/d/')[1].split('/')[0];
    else if(link.includes('open?id=')) id=link.split('open?id=')[1].split('&')[0];
    else if(link.includes('id=')) id=link.split('id=')[1].split('&')[0].split('/')[0];
    if(id && id.length>10) return 'https://drive.google.com/uc?export=download&id='+id;
    return link;
  }catch(e){ return link; }
}

function loadNotes(){
  db.collection("education_resources").orderBy("createdAt","desc").onSnapshot(snap=>{
    allNotes=[];
    snap.forEach(doc=>{ allNotes.push({id:doc.id,...doc.data()}); });
    render(allNotes);
  });
}

function render(list){
  const box=document.getElementById("notesList");
  if(list.length==0){box.innerHTML="<p style='text-align:center;color:#999;margin-top:30px'>No resources found in this category.</p>";return;}
  box.innerHTML=list.map(n=>`
    <div class="card">
      <h3>${n.title||'Untitled'}</h3>
      <p>${n.subject||''} • ${n.type||''} • ${n.year||''} • ${n.level||''}</p>
      <p>${n.desc||''}</p>
      <a href="${toDirectDownload(n.link)}" target="_blank" class="btn btn-blue">📥 Download Real PDF</a>
      <a href="${n.link}" target="_blank" class="btn btn-outline">👁️ Preview</a>
    </div>
  `).join("");
}

function filterBy(cat){
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  let btnId="f-all";
  if(cat=="past paper") btnId="f-past";
  else if(cat=="msce") btnId="f-msce";
  else if(cat=="jce") btnId="f-jce";
  else if(cat=="university") btnId="f-university";
  else if(cat=="scholarship") btnId="f-scholarship";
  else if(cat=="notes") btnId="f-notes";
  else if(cat=="syllabus") btnId="f-syllabus";
  else if(cat=="books") btnId="f-books";
  if(document.getElementById(btnId)) document.getElementById(btnId).classList.add("active");

  if(cat==='university'){
    document.getElementById("notesList").innerHTML="";
    document.getElementById("trustedBox").style.display="block";
    document.getElementById("trustedBox").innerHTML=`
      <div class="card" style="border:1.5px solid #0a3d6b">
        <h3>🎓 University Applications - Official Platforms</h3>
        <div class="trusted-grid" style="margin-top:12px">
          <a href="https://www.nche.ac.mw" target="_blank" class="btn btn-blue">NCHE Malawi</a>
          <a href="https://www.education.gov.mw" target="_blank" class="btn btn-green">Ministry of Education</a>
          <a href="https://www.unima.ac.mw" target="_blank" class="btn btn-blue">UNIMA</a>
          <a href="https://www.must.ac.mw" target="_blank" class="btn btn-green">MUST</a>
          <a href="https://www.luanar.ac.mw" target="_blank" class="btn btn-blue">LUANAR</a>
          <a href="https://www.mubas.ac.mw" target="_blank" class="btn btn-green">MUBAS</a>
        </div>
      </div>`; return;
  }
  if(cat==='scholarship'){
    document.getElementById("notesList").innerHTML="";
    document.getElementById("trustedBox").style.display="block";
    document.getElementById("trustedBox").innerHTML=`
      <div class="card" style="border:1.5px solid #0f6a3a">
        <h3>💰 Scholarships - Trusted Platforms</h3>
        <div class="trusted-grid" style="margin-top:12px">
          <a href="https://mastercardfdn.org/all/scholars/becoming-a-scholar/" target="_blank" class="btn btn-orange">Mastercard Foundation</a>
          <a href="https://cscuk.fcdo.gov.uk/scholarships/" target="_blank" class="btn btn-blue">Commonwealth UK</a>
          <a href="https://www.daad.de/en/" target="_blank" class="btn btn-green">DAAD Germany</a>
          <a href="https://www.scholarshipportal.com" target="_blank" class="btn btn-blue">ScholarshipPortal</a>
          <a href="https://opportunitydesk.org" target="_blank" class="btn btn-orange">Opportunity Desk</a>
          <a href="https://www.unesco.org/en/fellowships" target="_blank" class="btn btn-green">UNESCO</a>
        </div>
      </div>`; return;
  }
  document.getElementById("trustedBox").style.display="none";
  if(cat==='all'){render(allNotes);return;}
  const filtered=allNotes.filter(n=> {
    const hay = ((n.type||"")+" "+(n.subject||"")+" "+(n.level||"")+" "+(n.title||"")).toLowerCase();
    return hay.includes(cat);
  });
  render(filtered);
}

function doSearch(){
  const q=document.getElementById("searchInput").value.toLowerCase();
  const filtered=allNotes.filter(n=> JSON.stringify(n).toLowerCase().includes(q));
  document.getElementById("trustedBox").style.display="none";
  render(filtered);
}

function openShareModal(){ document.getElementById("shareModal").classList.add("show"); }
function closeShareModal(){ document.getElementById("shareModal").classList.remove("show"); }

function submitShare(){
  const title=document.getElementById("mTitle").value.trim();
  const level=document.getElementById("mLevel").value;
  const subject=document.getElementById("mSubject").value.trim();
  const type=document.getElementById("mType").value;
  const link=document.getElementById("mLink").value.trim();
  if(!title ||!level ||!type ||!link){ alert("Please fill all required fields *"); return; }
  db.collection("education_resources").add({
    title:title, subject:subject, level:level.toUpperCase(), type:type.toLowerCase(), link:link, desc:"Shared by Alumni", year:new Date().getFullYear().toString(), uploadedBy:"alumni", createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    alert("✅ Shared successfully! Will auto-download as Real PDF");
    closeShareModal();
    document.getElementById("mTitle").value=""; document.getElementById("mSubject").value=""; document.getElementById("mLink").value="";
  });
}

loadNotes();
</script>
</body>
</html>
