<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Classmates - Chitekesa Alumni</title>
<link rel="stylesheet" href="style.css">
<style>
.find-hero { background: linear-gradient(135deg, #1a1a2e, #16213e); color:white; padding:50px 20px; text-align:center; }
.search-box { max-width:800px; margin:-30px auto 30px; background:white; padding:20px; border-radius:16px; box-shadow:0 15px 30px rgba(0,0,0,0.1); display:flex; gap:10px; flex-wrap:wrap; }
.search-box input, .search-box select { flex:1; min-width:150px; padding:14px; border-radius:10px; border:1px solid #ddd; }
.classmate-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:20px; max-width:1100px; margin:auto; padding:20px; }
.mate-card { background:white; border-radius:16px; padding:20px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,0.06); }
.mate-avatar { width:80px; height:80px; border-radius:50%; background:#3282b8; color:white; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:bold; margin:0 auto 15px; }
.mate-year { background:#0f4c75; color:white; padding:3px 10px; border-radius:20px; font-size:12px; }
</style>
</head>
<body>
<div class="find-hero">
  <h1>👥 Find Your Classmates</h1>
  <p>Reconnect with Chitekesa Alumni from all years</p>
</div>

<div class="search-box">
  <input type="text" id="searchName" placeholder="Search by name..." onkeyup="filterMates()">
  <select id="filterYear" onchange="filterMates()">
    <option value="">All Years</option>
    <option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option><option>2019</option><option>2018</option>
  </select>
  <select id="filterClass" onchange="filterMates()">
    <option value="">All Classes</option>
    <option>Form 4</option><option>Form 3</option><option>Form 2</option><option>Form 1</option>
  </select>
</div>

<div class="classmate-grid" id="classmateGrid">
  <p style="text-align:center; width:100%;">Loading classmates...</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { /* paste your config here */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allMates = [];
async function loadMates() {
  const snap = await getDocs(collection(db, "users"));
  const grid = document.getElementById('classmateGrid');
  grid.innerHTML = "";
  snap.forEach(doc => {
    const u = doc.data();
    allMates.push(u);
  });
  renderMates(allMates);
}

function renderMates(list) {
  const grid = document.getElementById('classmateGrid');
  if(list.length==0){ grid.innerHTML="<p>No classmates found</p>"; return; }
  grid.innerHTML = list.map(u => `
    <div class="mate-card">
      <div class="mate-avatar">${(u.displayName||u.email||'A')[0].toUpperCase()}</div>
      <h3>${u.displayName||u.email}</h3>
      <p style="color:#666; font-size:14px;">${u.career||'Alumni Member'}</p>
      <div style="margin:10px 0;"><span class="mate-year">Class of ${u.gradYear||'2020'}</span></div>
      <button style="padding:8px 16px; border-radius:20px; border:1px solid #0f4c75; background:white; color:#0f4c75; cursor:pointer;">Connect</button>
    </div>
  `).join('');
}

window.filterMates = () => {
  const name = document.getElementById('searchName').value.toLowerCase();
  const year = document.getElementById('filterYear').value;
  const filtered = allMates.filter(u => {
    const matchName = (u.displayName||u.email||'').toLowerCase().includes(name);
    const matchYear = !year || (u.gradYear==year);
    return matchName && matchYear;
  });
  renderMates(filtered);
}
loadMates();
</script>
</body>
</html>
